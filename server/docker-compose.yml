services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    # Lets the container reach Ollama, which publishes port 11434 on the homelab itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DASHBOARD_OWNER_LOGIN: ${DASHBOARD_OWNER_LOGIN:-}
      DASHBOARD_OWNER_NAME: ${DASHBOARD_OWNER_NAME:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-8k}
