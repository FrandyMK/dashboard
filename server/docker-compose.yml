services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    environment:
      DASHBOARD_OWNER_LOGIN: ${DASHBOARD_OWNER_LOGIN:-}
      DASHBOARD_OWNER_NAME: ${DASHBOARD_OWNER_NAME:-}
